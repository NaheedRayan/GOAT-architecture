services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: goat
      POSTGRES_PASSWORD: goat
      POSTGRES_DB: goat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goat"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
